<omla-biblioteca-form-presenter
  [modo]="modo()"
  (submitForm)="onSubmit()"
  (cancelar)="onCancelar()" />

<omla-listado-livros-elemento
  [estaCarregando]="livrosBibliotecaResource.isLoading()"
  [livros]="livrosBibliotecaResource.value()"
  (navegarLivro)="onIrPagina('/livros/livro', $event)"
  (navegarAutor)="onIrPagina('/autores/autor', $event)" />
