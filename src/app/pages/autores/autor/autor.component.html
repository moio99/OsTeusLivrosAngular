<omla-autor-form-presenter
  [modo]="modo()"
  (submitForm)="onSubmit($event)"
  (cancelar)="onCancelar()" />

<omla-listado-livros-elemento
  [estaCarregando]="livrosAutorResource.isLoading()"
  [livros]="livrosAutorResource.value()"
  [amosarAutor]="false"
  (navegarLivro)="onIrPagina('/livros/livro', $event)" />
