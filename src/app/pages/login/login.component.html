<div class="login-container" *transloco="let t">
  <h2>{{t('login.titulo')}}</h2>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
    <div class="form-group">
      <label for="nome">{{t('login.nomeUsuario')}}</label>
      <input
        type="text"
        id="nome"
        formControlName="nome"
        [placeholder]="t('login.placeholderNome')"
        [class.is-invalid]="loginForm.controls.nome.invalid && loginForm.controls.nome.touched">
      @if (loginForm.controls.nome.invalid && loginForm.controls.nome.touched) {
        <div class="invalid-feedback">
          {{t('login.nomeObrigatorio')}}
        </div>
      }
    </div>

    <div class="form-group">
      <label for="contrasinal">{{t('login.contrasinal')}}</label>
      <input
        type="password"
        id="contrasinal"
        formControlName="contrasinal"
        [placeholder]="t('login.placeholderContrasinal')"
        [class.is-invalid]="loginForm.controls.contrasinal.invalid && loginForm.controls.contrasinal.touched">
      @if (loginForm.controls.contrasinal.invalid && loginForm.controls.contrasinal.touched) {
        <div class="invalid-feedback">
          {{t('login.contrasinalObrigatorio')}}
        </div>
      }
    </div>

    @if (error()) {
      <div class="alert alert-danger">
        {{ error() }}
      </div>
    }

    <button type="submit" color="primary" [disabled]="loading() || loginForm.invalid">
      @if (loading()) {
        <span class="spinner-border spinner-border-sm"></span>
      }
      {{ loading() ? t('login.ingresando') : t('login.ingresar') }}
    </button>
  </form>
</div>
