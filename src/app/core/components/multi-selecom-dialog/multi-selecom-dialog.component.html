<div class="fun">
  <div class="contedor-dialogo popup-multiselecom">

    <div class="boton-fechar">
      <button (click)="onFechar()">{{ 'common.close' | transloco }}</button>
    </div>

    <input class="filtro-caixa"
           type="text"
           (input)="onCambioFiltro($event)"
           [placeholder]="'multiSelect.filterPlaceholder' | transloco">

    <div>
      <!-- PANEL ESQUERDO: Todos os elementos -->
      <div class="example-container container-todo">
        <span>{{ 'common.all' | transloco }}</span>
        <div
          cdkDropList
          #TodoList="cdkDropList"
          [id]="'listadoTodo'"
          [cdkDropListData]="totalFiltrado()"
          [cdkDropListConnectedTo]="[EscolmaList]"
          class="example-list"
          (cdkDropListDropped)="onMover($event)">

          @for (item of totalFiltrado(); track item.id) {
            <div class="example-box" cdkDrag>{{ item.value }}</div>
          } @empty {
            <div class="example-box baleiro">{{ 'common.noFilteredItems' | transloco }}</div>
          }

        </div>
      </div>

      <!-- PANEL DEREITO: Elementos seleccionados (Escolma) -->
      <div class="example-container">
        <span>{{ 'common.selection' | transloco }}</span>
        <div
          cdkDropList
          #EscolmaList="cdkDropList"
          [id]="'listadoEscolma'"
          [cdkDropListData]="escolma()"
          [cdkDropListConnectedTo]="[TodoList]"
          class="example-list"
          (cdkDropListDropped)="onMover($event)">

          @for (item of escolma(); track item.id) {
            <div class="example-box" cdkDrag>{{ item.value }}</div>
          }

        </div>
      </div>
    </div>

  </div>
</div>
