<h3>Listado de Bibliotecas</h3>
<button class="botom-novo-resgistro" (click)="onIrPagina('/bibliotecas/biblioteca', 0)">
  Nova Biblioteca
</button>

<h1 *ngIf="tipoListado.length > 0">Listado {{this.tipoListado}}</h1>

<table *ngIf="this.listadoDados.length > 0" class="taboas-listado">
  <tr>
    <th>Nome</th>
    <th>Data renovaçom</th>
    <th>Livros</th>
  </tr>
  <tr *ngFor="let entrada of this.listadoDados" class="listado-accom">
    <td (click)="onIrPagina('/bibliotecas/biblioteca', entrada.id)">{{entrada.nome}}</td>
    <td (click)="onIrPagina('/bibliotecas/biblioteca', entrada.id)">{{entrada.dataRenovacom ? (entrada.dataRenovacom | date:'dd/MM/yyyy') : '---'}}</td>
    <td (click)="onIrPagina('/bibliotecas/biblioteca', entrada.id)">{{entrada.quantidadeLivros}}</td>
    <td (click)="onBorrarElemento(entrada.id, entrada.nome, entrada.quantidadeLivros)">
      <img src="../../../../assets/images/cubo-lixo.png" alt="Borrar">
    </td>
  </tr>
</table>
